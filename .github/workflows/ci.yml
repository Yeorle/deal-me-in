name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # lint / tsc / vitest never launch Electron (tests mock it), so the
      # ~100 MB binary download is skipped.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The plain `tsc` run ignores project references, so the Vite config
      # files (tsconfig.node.json) need their own typecheck pass.
      - run: npx tsc --noEmit && npx tsc -p tsconfig.node.json --noEmit
      # Build the renderer + main/preload bundles (not electron-builder — that
      # needs the Electron binary). Catches build-only breakage the typecheck
      # and tests cannot see (CSP injection, plugin/assets regressions).
      - run: npx vite build
      - run: npm run test
